<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tomtom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho fixo com abas estilo TikTok, trilha de etapas com setas, cartão de conteúdo e corações ao fundo */
:root {
  --bg: #FFE4EC;
  --bg-soft: #FFF2F6;
  --card: #FFFFFF;
  --ink: #1E1420;
  --muted: #6F5C68;
  --accent: #E6174A;
  --cyan: #25F4EE;
  --line: #F5C6D6;
  --ok: #138A4B;
  --ok-bg: #E4F7EC;
  --bad-bg: #FFE3E8;
  --font-display: "Poppins", "Segoe UI", sans-serif;
  --font-body: "DM Sans", "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 15% 0%, #FFF7FA 0, transparent 45%), radial-gradient(circle at 100% 100%, #FFD3E1 0, transparent 40%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.65;
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* corações decorativos */
#hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.heart { position: absolute; bottom: -60px; fill: #FF5C86; opacity: 0; animation: float var(--d) linear forwards; }
.heart svg { width: 100%; height: 100%; display: block; }
.heart.still { animation: none; bottom: auto; opacity: .08; }
@keyframes float {
  0% { transform: translateY(0) rotate(-10deg); opacity: 0; }
  15% { opacity: var(--o); }
  85% { opacity: var(--o); }
  100% { transform: translateY(-115vh) translateX(var(--x)) rotate(12deg); opacity: 0; }
}

/* cabeçalho */
header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255, 228, 236, .92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top { max-width: 800px; margin: 0 auto; padding: 14px 16px 0; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: -.03em; line-height: 1; text-shadow: -2px -2px 0 var(--cyan), 2px 2px 0 #FF3B6B; }
.subject { font-size: 14px; font-weight: 600; background: var(--card); border: 1px solid var(--line); padding: 5px 16px; border-radius: 999px; }
.tabs { display: flex; gap: 24px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 10px 0 14px; font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--muted); position: relative; white-space: nowrap; transition: color .25s; }
.tab::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 28px; height: 3px; border-radius: 3px; background: var(--ink); box-shadow: 2px 0 0 var(--cyan); transform: translateX(-50%) scaleX(0); transition: transform .35s var(--ease); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; }
.tab[aria-selected="true"]::after { transform: translateX(-50%) scaleX(1); }

main { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 22px 16px 72px; }
section[hidden] { display: none; }

/* chips de capítulo */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 16px; font-size: 15px; font-weight: 500; transition: background .25s, color .25s, box-shadow .25s, border-color .25s; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: 2px 2px 0 var(--cyan); }

h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
.chapter-head { margin: 8px 0 20px; }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--accent); margin: 0 0 4px; }
.chapter-head h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; text-shadow: 2px 2px 0 var(--cyan); }
.chapter-head p:not(.eyebrow) { margin: 10px 0 0; color: var(--muted); max-width: 60ch; }

/* trilha de etapas com setas */
.stepper { list-style: none; margin: 0 0 20px; padding: 4px 2px 12px; display: flex; align-items: flex-start; overflow-x: auto; scrollbar-width: none; position: relative; }
.stepper::-webkit-scrollbar { display: none; }
.stepper li { flex: none; display: flex; }
.step { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 88px; background: none; border: 0; padding: 0; }
.dot { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; background: var(--card); border: 2px solid var(--line); color: var(--muted); transition: transform .3s var(--ease), background .35s, border-color .35s, color .35s, box-shadow .35s; }
.step:hover .dot { transform: scale(1.07); }
.step.done .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.current .dot { background: var(--card); border-color: var(--ink); color: var(--ink); box-shadow: 3px 3px 0 var(--cyan); transform: scale(1.06); }
.step.done.current .dot { background: var(--accent); color: #fff; }
.step-label { font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.25; transition: color .3s; }
.step.current .step-label { color: var(--ink); }
.arrow { width: 36px; height: 48px; align-items: center; justify-content: center; color: var(--line); transition: color .4s; }
.arrow.on { color: var(--accent); }
.arrow svg { width: 28px; height: 28px; }

/* cartão de conteúdo */
.card { background: var(--card); border-radius: 26px; padding: 26px 22px; box-shadow: 0 10px 30px rgba(230, 23, 74, .08); border: 1px solid #FBDCE6; scroll-margin-top: 150px; }
.bar { height: 8px; background: var(--bg); border-radius: 8px; overflow: hidden; margin-bottom: 22px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 8px; transition: width .6s var(--ease); }
.progress-text { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.card h2 { font-size: 28px; font-weight: 700; margin-bottom: 14px; }
.card h3 { font-size: 20px; margin: 22px 0 6px; }
.card p { margin: 0 0 14px; max-width: 62ch; }
.card ul { margin: 0 0 14px; padding-left: 22px; max-width: 62ch; }
.card li { margin-bottom: 8px; }
.callout { background: var(--bg-soft); border-left: 4px solid var(--accent); border-radius: 0 16px 16px 0; padding: 14px 18px; margin: 18px 0; font-weight: 500; }
.works { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin: 14px 0; }
.work { background: var(--bg-soft); border-radius: 18px; padding: 16px; }
.work b { font-family: var(--font-display); display: block; font-size: 17px; }
.work small { color: var(--muted); display: block; margin-bottom: 6px; font-size: 14px; }
.work span { font-size: 16px; line-height: 1.5; display: block; }

.qa { border-top: 1px solid var(--line); padding: 14px 0; }
.qa p { margin: 0 0 10px; font-weight: 600; }
.qa .ans { background: var(--bg-soft); border-radius: 14px; padding: 12px 16px; margin-top: 10px; }
.check { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check input { width: 24px; height: 24px; accent-color: var(--accent); margin-top: 2px; flex: none; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
.btn { border: 2px solid var(--ink); background: var(--card); border-radius: 999px; padding: 11px 22px; font-weight: 600; font-size: 16px; transition: transform .2s var(--ease), opacity .2s, box-shadow .2s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 3px 3px 0 var(--cyan); }
.btn:disabled { opacity: .4; cursor: default; }
.finished { text-align: center; padding: 14px 0 0; margin: 0; font-weight: 600; color: var(--accent); }

.empty { text-align: center; padding: 40px 14px; color: var(--muted); }
.empty h2 { color: var(--ink); font-size: 22px; margin-bottom: 8px; }
.empty p { margin: 0 auto; }

/* grade de capítulos */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.cap { text-align: left; background: var(--card); border: 1px solid #FBDCE6; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 22px rgba(230, 23, 74, .06); transition: transform .3s var(--ease), box-shadow .3s; }
.cap:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(230, 23, 74, .12); }
.cap .num { font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--accent); }
.cap h3 { font-size: 21px; }
.cap p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--muted); }
.cap .bar { margin: 6px 0 0; }
.cap .meta { font-size: 14px; font-weight: 600; color: var(--muted); }

/* flashcard */
.flip { perspective: 1000px; width: 100%; background: none; border: 0; padding: 0; display: block; }
.flip-in { position: relative; min-height: 260px; transition: transform .6s var(--ease); transform-style: preserve-3d; }
.flip.show .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; padding: 26px; display: grid; place-items: center; text-align: center; font-weight: 600; font-size: 22px; line-height: 1.4; background: var(--card); border: 1px solid #FBDCE6; box-shadow: 0 10px 30px rgba(230, 23, 74, .08); }
.face.back { transform: rotateY(180deg); background: var(--ink); color: #fff; box-shadow: 4px 4px 0 var(--cyan); font-size: 20px; }
.face small { display: block; font-size: 13px; font-weight: 600; opacity: .7; margin-bottom: 10px; letter-spacing: .06em; }
.cardnav { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
.cardnav span { font-weight: 600; color: var(--muted); }

/* simulado */
.qtext { font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.4; margin: 0 0 18px; max-width: 62ch; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; font-size: 17px; line-height: 1.5; transition: border-color .25s, background .25s, transform .2s var(--ease); }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:active:not(:disabled) { transform: scale(.99); }
.opt:disabled { cursor: default; color: var(--ink); }
.letter { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; background: var(--bg); transition: background .25s, color .25s; }
.opt.sel { border-color: var(--ink); background: var(--bg-soft); box-shadow: 3px 3px 0 var(--cyan); }
.opt.sel .letter { background: var(--ink); color: #fff; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .letter { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--accent); background: var(--bad-bg); }
.opt.wrong .letter { background: var(--accent); color: #fff; }
.exp { margin-top: 18px; background: var(--bg-soft); border-left: 4px solid var(--ink); border-radius: 0 16px 16px 0; padding: 14px 18px; font-size: 17px; }
.exp b { display: block; font-family: var(--font-display); margin-bottom: 4px; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: 1; text-shadow: 3px 3px 0 var(--cyan); margin: 6px 0 10px; }
.review { list-style: none; padding: 0; margin: 20px 0 0; }
.review li { border-top: 1px solid var(--line); padding: 12px 0; font-size: 16px; line-height: 1.5; margin: 0; }
.review b { font-family: var(--font-display); }
.review .ok { color: var(--ok); }
.review .no { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .flip-in, .dot, .bar i, .tab::after, .opt, .chip, .cap, .btn, .arrow { transition: none; }
  .heart { animation: none; }
}
@media (min-width: 640px) {
  .card { padding: 34px 40px; }
  .chapter-head h1 { font-size: 40px; }
  .top { padding-top: 18px; }
}
</style>
</head>
<body>

<div id="hearts" aria-hidden="true"></div>

<header>
  <div class="top">
    <div class="brand">
      <div class="logo">tomtom</div>
      <div class="subject" id="subjectName"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Seções do site">
      <button class="tab" role="tab" id="t-trilha" data-tab="trilha" aria-selected="true">Trilha de estudo</button>
      <button class="tab" role="tab" id="t-capitulos" data-tab="capitulos" aria-selected="false">Capítulos</button>
      <button class="tab" role="tab" id="t-revisao" data-tab="revisao" aria-selected="false">Revisão</button>
      <button class="tab" role="tab" id="t-simulado" data-tab="simulado" aria-selected="false">Simulado</button>
    </nav>
  </div>
</header>

<main>
  <section id="trilha" role="tabpanel" aria-labelledby="t-trilha"></section>
  <section id="capitulos" role="tabpanel" aria-labelledby="t-capitulos" hidden></section>
  <section id="revisao" role="tabpanel" aria-labelledby="t-revisao" hidden></section>
  <section id="simulado" role="tabpanel" aria-labelledby="t-simulado" hidden></section>
</main>

<script>
/* =====================================================================
   CONTEÚDO DA MATÉRIA
   Para trocar a matéria, edite só este bloco.
   - Cada capítulo tem etapas (a trilha com setas), cartões de revisão
     e questões de simulado (nível avançado, sempre sobre o capítulo).
   - Tipos de etapa: "texto", "perguntas", "checklist".
   - Blocos de texto: p, h, ul, destaque, obras.
   - Questão do simulado: q = enunciado, o = 4 alternativas,
     c = índice da correta (0 a 3), e = explicação.
   ===================================================================== */
const MATERIA = {
  nome: "Artes",
  capitulos: [
    /* ---------------- 1. RENASCIMENTO ---------------- */
    {
      id: 1,
      titulo: "Renascimento",
      resumo: "A arte italiana que recuperou o ideal clássico e colocou o ser humano no centro (séculos XIV a XVI).",
      etapas: [
        { titulo: "Contexto", tipo: "texto", blocos: [
          { t: "p", x: "O Renascimento nasceu na Itália, principalmente em Florença, entre os séculos XIV e XVI. As cidades-estado eram ricas pelo comércio e pelos bancos, e famílias como os Medici pagavam artistas para criar obras." },
          { t: "h", x: "O que mudou na forma de pensar" },
          { t: "ul", x: [
            "Humanismo: o ser humano e a razão ganham valor.",
            "Antropocentrismo: o homem passa a ser o centro do interesse, no lugar da visão centrada em Deus da Idade Média.",
            "Valorização da Antiguidade greco-romana como modelo de beleza."
          ]},
          { t: "destaque", x: "A palavra “renascimento” indica o renascer dos ideais clássicos de equilíbrio, proporção e harmonia." }
        ]},
        { titulo: "Ideias-chave", tipo: "texto", blocos: [
          { t: "p", x: "A pintura, a escultura e a arquitetura passaram a buscar realismo e proporção. Três conceitos aparecem em quase todo trabalho do período." },
          { t: "h", x: "Perspectiva linear" },
          { t: "p", x: "Técnica que cria a ilusão de profundidade em uma superfície plana, com linhas que convergem para um ponto de fuga. É associada a Brunelleschi e ao arquiteto Alberti." },
          { t: "h", x: "Sfumato e claro-escuro" },
          { t: "p", x: "O sfumato suaviza os contornos como se fossem uma fumaça leve, e é marca de Leonardo da Vinci. O claro-escuro usa luz e sombra para dar volume às figuras." },
          { t: "h", x: "Anatomia e proporção" },
          { t: "p", x: "Os artistas estudavam o corpo humano para representá-lo com exatidão, e a escultura voltou a usar o nu e a postura natural." }
        ]},
        { titulo: "Artistas e obras", tipo: "texto", blocos: [
          { t: "p", x: "Alguns nomes e obras que costumam cair em prova:" },
          { t: "obras", x: [
            { nome: "Mona Lisa", autor: "Leonardo da Vinci", ano: "c. 1503–1506", nota: "Exemplo famoso de sfumato." },
            { nome: "A Última Ceia", autor: "Leonardo da Vinci", ano: "c. 1495–1498", nota: "Perspectiva central e composição equilibrada." },
            { nome: "Davi", autor: "Michelangelo", ano: "1501–1504", nota: "Escultura em mármore com anatomia detalhada." },
            { nome: "Teto da Capela Sistina", autor: "Michelangelo", ano: "1508–1512", nota: "Afrescos no Vaticano." },
            { nome: "A Escola de Atenas", autor: "Rafael Sanzio", ano: "1509–1511", nota: "Reúne filósofos antigos em uma arquitetura clássica." },
            { nome: "O Nascimento de Vênus", autor: "Sandro Botticelli", ano: "c. 1484–1486", nota: "Tema mitológico no Quattrocento." }
          ]}
        ]},
        { titulo: "Fixar", tipo: "perguntas", itens: [
          { q: "Onde e quando surgiu o Renascimento?", a: "Na Itália, com centro em Florença, entre os séculos XIV e XVI." },
          { q: "O que é antropocentrismo?", a: "A visão que coloca o ser humano como centro do interesse e do conhecimento." },
          { q: "Para que serve a perspectiva linear?", a: "Para criar a ilusão de profundidade numa superfície plana, usando linhas que convergem para um ponto de fuga." },
          { q: "Qual técnica de Leonardo suaviza os contornos?", a: "O sfumato." },
          { q: "Quem pintou A Escola de Atenas?", a: "Rafael Sanzio." }
        ]},
        { titulo: "Revisar", tipo: "checklist", itens: [
          "Sei explicar o que foi o humanismo.",
          "Consigo diferenciar sfumato de claro-escuro.",
          "Lembro de pelo menos uma obra de cada artista.",
          "Sei dizer por que a Itália foi o centro do movimento."
        ]}
      ],
      cards: [
        ["Humanismo", "Corrente que valoriza o ser humano, a razão e o conhecimento."],
        ["Perspectiva linear", "Técnica de profundidade com linhas convergindo para um ponto de fuga."],
        ["Sfumato", "Contornos suaves e esfumaçados, típicos de Leonardo da Vinci."],
        ["Medici", "Família de banqueiros de Florença que patrocinava artistas."],
        ["Davi", "Escultura de Michelangelo em mármore, feita entre 1501 e 1504."]
      ],
      simulado: [
        { q: "Sobre a perspectiva atmosférica (ou aérea), técnica explorada por Leonardo da Vinci, é correto afirmar que ela",
          o: ["cria profundidade por linhas que convergem para um único ponto de fuga.",
              "sugere distância ao suavizar contornos e esmaecer ou azular os planos mais afastados.",
              "dispensa qualquer variação de cor e usa apenas o tamanho das figuras.",
              "foi abandonada no Renascimento em favor da pintura chapada, sem volume."],
          c: 1, e: "A perspectiva linear usa linhas convergentes. A atmosférica imita o efeito do ar, que reduz a nitidez e o contraste e tende ao azul nos planos distantes." },
        { q: "Qual associação entre período e características do Renascimento italiano está correta?",
          o: ["Quattrocento: século XIV, arte bizantina, figuras planas e sem perspectiva.",
              "Quattrocento: século XVI, centrado em Veneza, sem interesse pela Antiguidade.",
              "Cinquecento: século XVI, Alta Renascença, com Leonardo, Michelangelo e Rafael no auge.",
              "Cinquecento: século XV, centrado em Florença, com ênfase em Botticelli."],
          c: 2, e: "Quattrocento designa o século XV (Florença, Masaccio, Botticelli). Cinquecento designa o século XVI, com a Alta Renascença de Leonardo, Michelangelo e Rafael." },
        { q: "O mecenato exercido por famílias como os Medici teve, no contexto renascentista, o efeito de",
          o: ["financiar encomendas e contribuir para que o artista passasse da condição de artesão à de intelectual reconhecido.",
              "proibir temas mitológicos e restringir a produção a assuntos religiosos.",
              "substituir as guildas por escolas estatais gratuitas de arte.",
              "eliminar a encomenda privada e concentrar toda a produção na Igreja."],
          c: 0, e: "A encomenda privada e o prestígio das cortes e dos banqueiros impulsionaram a valorização social do artista, que passou a ser visto como pensador." },
        { q: "Na Escola de Atenas, de Rafael, Platão e Aristóteles aparecem ao centro com gestos distintos. A leitura mais aceita desses gestos é:",
          o: ["Platão estende a mão à frente e Aristóteles aponta para o alto.",
              "ambos apontam para o chão, indicando a primazia da matéria.",
              "ambos seguram esferas, símbolo da astronomia medieval.",
              "Platão aponta para o alto, ligado ao mundo das ideias, e Aristóteles estende a mão à frente, ligado à observação do mundo concreto."],
          c: 3, e: "O contraste entre os gestos resume a diferença entre o idealismo platônico e o empirismo aristotélico, tema caro ao humanismo renascentista." },
        { q: "A Última Ceia, de Leonardo, deteriorou-se cedo principalmente porque",
          o: ["foi pintada em têmpera sobre madeira e danificada no transporte.",
              "Leonardo experimentou técnicas sobre parede seca, em vez do afresco tradicional sobre reboco úmido.",

const KEY = "tomtom-v1";
let state = { cap: 1, etapa: 0, done: {}, checks: {}, card: 0, virado: false, aba: "trilha", sim: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") state = Object.assign(state, s); } catch (e) {}
state.virado = false;
function salvar() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const capAtual = () => MATERIA.capitulos.find(c => c.id === state.cap) || MATERIA.capitulos[0];
const feitas = (c) => (state.done[c.id] || []).filter(Boolean).length;
const pct = (c) => c.vazio ? 0 : Math.round(100 * feitas(c) / c.etapas.length);

/* ---------- animações suaves ---------- */
function anim(el, kf, opt) {
  if (reduz || !el || !el.animate) return Promise.resolve();
  return el.animate(kf, opt).finished.catch(() => {});
}
const seqs = new WeakMap();
function swap(el, html, animate) {
  const my = (seqs.get(el) || 0) + 1; seqs.set(el, my);
  if (!animate || reduz) { el.innerHTML = html; return; }
  anim(el, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(6px)" }], { duration: 150, easing: "ease-out", fill: "forwards" }).then(() => {
    if (seqs.get(el) !== my) return;
    el.innerHTML = html;
    el.getAnimations().forEach(a => a.cancel());
    anim(el, [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 340, easing: "cubic-bezier(.2,.7,.2,1)" });
  });
}
function reveal(el) {
  el.hidden = false;
  anim(el, [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 320, easing: "cubic-bezier(.2,.7,.2,1)" });
}

/* ---------- Trilha ---------- */
function bloco(b) {
  if (b.t === "p") return `<p>${b.x}</p>`;
  if (b.t === "h") return `<h3>${b.x}</h3>`;
  if (b.t === "ul") return "<ul>" + b.x.map(i => `<li>${i}</li>`).join("") + "</ul>";
  if (b.t === "destaque") return `<div class="callout">${b.x}</div>`;
  if (b.t === "obras") return '<div class="works">' + b.x.map(o =>
    `<div class="work"><b>${o.nome}</b><small>${o.autor} · ${o.ano}</small><span>${o.nota}</span></div>`).join("") + "</div>";
  return "";
}

function stageHTML(c) {
  const e = c.etapas[state.etapa];
  let h = `<h2>${e.titulo}</h2>`;
  if (e.tipo === "texto") h += e.blocos.map(bloco).join("");
  if (e.tipo === "perguntas") h += e.itens.map((q, i) =>
    `<div class="qa"><p>${i + 1}. ${q.q}</p><button class="btn" data-ans="${i}">Ver resposta</button><div class="ans" hidden>${q.a}</div></div>`).join("");
  if (e.tipo === "checklist") h += e.itens.map((t, i) => {
    const k = `${c.id}-${state.etapa}-${i}`;
    return `<label class="check"><input type="checkbox" data-check="${k}" ${state.checks[k] ? "checked" : ""}><span>${t}</span></label>`;
  }).join("");
  return h;
}

function renderTrilha() {
  const c = capAtual();
  let h = chips() + `<div class="chapter-head"><p class="eyebrow">Capítulo ${c.id}</p><h1>${c.titulo}</h1><p>${c.resumo}</p></div>`;
  if (c.vazio) { $("trilha").innerHTML = h + vazio("Quando a matéria chegar, ela é dividida em etapas de estudo e aparece aqui com a trilha de setas."); return; }
  let d = state.done[c.id];
  if (!d || d.length !== c.etapas.length) d = state.done[c.id] = c.etapas.map(() => false);
  if (state.etapa >= c.etapas.length) state.etapa = 0;
  const total = c.etapas.length;
  h += '<ol class="stepper" id="stepper" aria-label="Etapas do capítulo">';
  c.etapas.forEach((et, i) => {
    h += `<li><button class="step" data-etapa="${i}"><span class="dot"></span><span class="step-label">${et.titulo}</span></button></li>`;
    if (i < total - 1) h += `<li class="arrow" aria-hidden="true">${ARROW}</li>`;
  });
  h += `</ol><article class="card" id="card"><p class="progress-text" id="ptxt"></p>
    <div class="bar"><i id="pbar"></i></div><div id="stageBody"></div>
    <div class="nav"><button class="btn" id="bBack" data-nav="-1">← Voltar</button><button class="btn primary" id="bNext" data-nav="1"></button></div>
    <p class="finished" id="fin" hidden>Capítulo concluído. Bom trabalho!</p></article>`;
  $("trilha").innerHTML = h;
  updateTrilha(false);
}

function centerStep() {
  const st = $("stepper"); if (!st) return;
  const b = st.querySelector(".step.current"); if (!b) return;
  st.scrollTo({ left: b.parentElement.offsetLeft - (st.clientWidth - b.offsetWidth) / 2, behavior: reduz ? "auto" : "smooth" });
}

function updateTrilha(animate) {
  const c = capAtual(); if (c.vazio) return;
  const d = state.done[c.id], total = c.etapas.length;
  document.querySelectorAll("#trilha .step").forEach((b, i) => {
    b.className = "step" + (d[i] ? " done" : "") + (i === state.etapa ? " current" : "");
    b.querySelector(".dot").textContent = d[i] ? "✓" : i + 1;
    if (i === state.etapa) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
  });
  document.querySelectorAll("#trilha .arrow").forEach((a, i) => a.classList.toggle("on", !!d[i]));
  $("ptxt").textContent = `Etapa ${state.etapa + 1} de ${total} · ${pct(c)}% concluído`;
  $("pbar").style.width = pct(c) + "%";
  $("bBack").disabled = state.etapa === 0;
  $("bNext").textContent = state.etapa === total - 1 ? "Concluir capítulo ✓" : "Concluir e avançar →";
  const fin = $("fin"), todas = d.every(Boolean);
  if (todas && fin.hidden) reveal(fin); else if (!todas) fin.hidden = true;
  swap($("stageBody"), stageHTML(c), animate);
  centerStep(); salvar();
}

function suave() {
  const card = $("card"); if (!card) return;
  if (card.getBoundingClientRect().top < 140) card.scrollIntoView({ behavior: reduz ? "auto" : "smooth", block: "start" });
}

/* ---------- Capítulos ---------- */
function renderCapitulos() {
  $("capitulos").innerHTML = `<div class="chapter-head"><p class="eyebrow">${MATERIA.nome}</p><h1>Capítulos</h1></div><div class="grid">` +
    MATERIA.capitulos.map(c => `<button class="cap" data-open="${c.id}">
      <span class="num">CAPÍTULO ${c.id}</span><h3>${c.titulo}</h3><p>${c.resumo}</p>
      <div class="bar" aria-hidden="true"><i style="width:${pct(c)}%"></i></div>
      <span class="meta">${c.vazio ? "Em breve" : feitas(c) + " de " + c.etapas.length + " etapas"}</span></button>`).join("") + "</div>";
}

/* ---------- Revisão (flashcards) ---------- */
function renderRevisao() {
  const c = capAtual();
  let h = chips() + head("Revisão");
  if (c.vazio || !c.cards || !c.cards.length) {
    $("revisao").innerHTML = h + vazio("Os cartões de revisão aparecem quando o conteúdo for adicionado."); return;
  }
  h += `<button class="flip" id="flip" data-flip aria-label="Virar cartão"><div class="flip-in">
      <div class="face"><div><small>TOQUE PARA VIRAR</small><span id="ff"></span></div></div>
      <div class="face back"><div><small>RESPOSTA</small><span id="fb"></span></div></div></div></button>
      <div class="cardnav"><button class="btn" data-card="-1">← Anterior</button><span id="cc"></span><button class="btn primary" data-card="1">Próximo →</button></div>`;
  $("revisao").innerHTML = h;
  fillCard();
}
function fillCard() {
  const c = capAtual();
  if (state.card >= c.cards.length) state.card = 0;
  const [f, v] = c.cards[state.card];
  $("ff").textContent = f; $("fb").textContent = v;
  $("cc").textContent = `${state.card + 1} / ${c.cards.length}`;
}
function goCard(dir) {
  const c = capAtual(), n = c.cards.length, f = $("flip");
  const run = () => {
    state.card = (state.card + dir + n) % n; fillCard(); salvar();
    anim(f, [{ opacity: 0, transform: `translateX(${dir * 22}px)` }, { opacity: 1, transform: "none" }], { duration: 300, easing: "cubic-bezier(.2,.7,.2,1)" });
  };
  if (state.virado) { state.virado = false; f.classList.remove("show"); setTimeout(run, reduz ? 0 : 280); } else run();
}

/* ---------- Simulado ---------- */
const LET = ["A", "B", "C", "D"];
function simState(c) {
  let s = state.sim[c.id];
  if (!s || s.resp.length !== c.simulado.length) s = state.sim[c.id] = { i: 0, resp: c.simulado.map(() => null), conf: c.simulado.map(() => false), fim: false };
  return s;
}
function renderSimulado() {
  const c = capAtual();
  let h = chips() + head("Simulado", "Questões de múltipla escolha, nível avançado, sobre este capítulo.");
  if (c.vazio || !c.simulado || !c.simulado.length) { $("simulado").innerHTML = h + vazio("As questões do simulado aparecem quando o conteúdo for adicionado."); return; }
  $("simulado").innerHTML = h + '<article class="card" id="simCard"><div id="simBody"></div></article>';
  drawSim(false);
}
function simHTML(c, s) {
  const n = c.simulado.length;
  if (s.fim) {
    const ac = c.simulado.filter((q, i) => s.resp[i] === q.c).length, p = Math.round(100 * ac / n);
    const msg = p >= 80 ? "Excelente! Você domina o capítulo." : p >= 60 ? "Bom caminho. Revise os pontos que errou." : "Vale voltar à trilha e revisar o capítulo.";
    return `<p class="progress-text">Resultado</p><div class="score">${ac}/${n}</div><p>${msg}</p>
      <ul class="review">${c.simulado.map((q, i) => { const ok = s.resp[i] === q.c;
        return `<li><b class="${ok ? "ok" : "no"}">${ok ? "✓" : "✗"} Questão ${i + 1}</b><br>Resposta certa: ${LET[q.c]}) ${q.o[q.c]}</li>`; }).join("")}</ul>
      <div class="nav"><button class="btn primary" data-sim="reset">Refazer simulado</button></div>`;
  }
  const q = c.simulado[s.i];
  return `<p class="progress-text">Questão ${s.i + 1} de ${n}</p><div class="bar"><i style="width:${Math.round(100 * s.i / n)}%"></i></div>
    <p class="qtext">${q.q}</p>
    <div class="opts">${q.o.map((t, k) => `<button class="opt" data-opt="${k}"><span class="letter">${LET[k]}</span><span>${t}</span></button>`).join("")}</div>
    <div class="exp" id="exp" hidden></div>
    <div class="nav"><span></span><button class="btn primary" id="simAct" data-act="confirm">Confirmar</button></div>`;
}
function drawSim(animate) {
  const c = capAtual(), s = simState(c);
  swap($("simBody"), simHTML(c, s), animate);
  if (!s.fim) {
    if (!animate || reduz) paintQ(false);
    else setTimeout(() => paintQ(false), 160);
  }
}
function paintQ(withAnim) {
  const c = capAtual(), s = simState(c); if (s.fim || !$("simAct")) return;
  const q = c.simulado[s.i], conf = s.conf[s.i], sel = s.resp[s.i];
  document.querySelectorAll("#simBody .opt").forEach((b, k) => {
    b.classList.toggle("sel", sel === k && !conf);
    b.classList.toggle("right", conf && k === q.c);
    b.classList.toggle("wrong", conf && sel === k && k !== q.c);
    b.disabled = conf;
  });
  const exp = $("exp"), acertou = sel === q.c;
  if (conf) {
    exp.innerHTML = `<b>${acertou ? "Correto!" : "Resposta certa: " + LET[q.c]}</b>${q.e}`;
    if (exp.hidden) { if (withAnim) reveal(exp); else exp.hidden = false; }
  } else exp.hidden = true;
  const act = $("simAct");
  act.dataset.act = conf ? "next" : "confirm";
  act.textContent = conf ? (s.i === c.simulado.length - 1 ? "Ver resultado" : "Próxima →") : "Confirmar";
  act.disabled = !conf && sel === null;
}

/* ---------- Abas ---------- */
const RENDER = { trilha: renderTrilha, capitulos: renderCapitulos, revisao: renderRevisao, simulado: renderSimulado };
function mostrar(aba, animate) {
  state.aba = aba;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === aba)));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== aba);
  RENDER[aba]();
  if (animate) anim($(aba), [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 340, easing: "cubic-bezier(.2,.7,.2,1)" });
  salvar();
}

/* ---------- Eventos ---------- */
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if (b && b.dataset.tab !== state.aba) mostrar(b.dataset.tab, true);
});
document.querySelector("main").addEventListener("click", e => {
  const t = e.target;
  const cap = t.closest("[data-cap]");
  if (cap) { if (+cap.dataset.cap === state.cap) return; state.cap = +cap.dataset.cap; state.etapa = 0; state.card = 0; state.virado = false; return mostrar(state.aba, true); }
  const open = t.closest("[data-open]");
  if (open) { state.cap = +open.dataset.open; state.etapa = 0; state.card = 0; return mostrar("trilha", true); }
  const et = t.closest("[data-etapa]");
  if (et) { state.etapa = +et.dataset.etapa; updateTrilha(true); return suave(); }
  const ans = t.closest("[data-ans]");
  if (ans) {
    const box = ans.nextElementSibling;
    if (box.hidden) { reveal(box); ans.textContent = "Esconder resposta"; } else { box.hidden = true; ans.textContent = "Ver resposta"; }
    return;
  }
  const nav = t.closest("[data-nav]");
  if (nav) {
    const c = capAtual(), d = state.done[c.id], dir = +nav.dataset.nav;
    if (dir > 0) { d[state.etapa] = true; if (state.etapa < c.etapas.length - 1) state.etapa++; }
    else if (state.etapa > 0) state.etapa--;
    updateTrilha(true); return suave();
  }
  if (t.closest("[data-flip]")) { state.virado = !state.virado; $("flip").classList.toggle("show", state.virado); return; }
  const cd = t.closest("[data-card]");
  if (cd) return goCard(+cd.dataset.card);
  const opt = t.closest("[data-opt]");
  if (opt) { const s = simState(capAtual()); if (!s.conf[s.i]) { s.resp[s.i] = +opt.dataset.opt; paintQ(false); salvar(); } return; }
  const act = t.closest("[data-act]");
  if (act) {
    const c = capAtual(), s = simState(c);
    if (act.dataset.act === "confirm") { if (s.resp[s.i] !== null) { s.conf[s.i] = true; paintQ(true); salvar(); } }
    else { if (s.i === c.simulado.length - 1) s.fim = true; else s.i++; drawSim(true); salvar(); suaveSim(); }
    return;
  }
  if (t.closest("[data-sim]")) { delete state.sim[capAtual().id]; drawSim(true); salvar(); suaveSim(); }
});
function suaveSim() {
  const c = $("simCard");
  if (c && c.getBoundingClientRect().top < 140) c.scrollIntoView({ behavior: reduz ? "auto" : "smooth", block: "start" });
}
document.querySelector("main").addEventListener("change", e => {
  if (e.target.dataset.check) { state.checks[e.target.dataset.check] = e.target.checked; salvar(); }
});

/* ---------- Corações decorativos ---------- */
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
const box = $("hearts");
function coracao(parado) {
  const el = document.createElement("div");
  const s = 16 + Math.random() * 34;
  el.className = "heart" + (parado ? " still" : "");
  el.style.width = el.style.height = s + "px";
  el.style.left = (2 + Math.random() * 94) + "%";
  el.style.setProperty("--d", (22 + Math.random() * 14) + "s");
  el.style.setProperty("--o", (0.08 + Math.random() * 0.07).toFixed(2));
  el.style.setProperty("--x", (Math.random() * 80 - 40) + "px");
  if (parado) el.style.top = (Math.random() * 90) + "%";
  el.innerHTML = HEART;
  el.addEventListener("animationend", () => el.remove());
  box.appendChild(el);
}
if (reduz) { for (let i = 0; i < 7; i++) coracao(true); }
else {
  coracao(); setTimeout(coracao, 1500); setTimeout(coracao, 3200);
  setInterval(() => { if (box.children.length < 9 && !document.hidden) coracao(); }, 4200);
}

$("subjectName").textContent = MATERIA.nome;
mostrar(state.aba, false);
</script>
</body>
</html>
